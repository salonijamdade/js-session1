<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .request{
            background-color: black;
            color: white;
            border: none;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 20px;
        }

        .schedule{
            background-color: rgb(230, 230, 230);
            border: none;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button class="request">
        request Now
    </button>
    <button class="schedule">
        schedule later
    </button>
</body>

</html>
